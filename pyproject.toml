[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use src.simulator.rng (constitution V)."
"numpy.random".msg = "Use src.simulator.rng (constitution V)."

[tool.ruff.lint.per-file-ignores]
"src/simulator/rng.py" = ["TID251"]
