# Example scenario config (architecture.md §2). One drone approaches the
# defended area, one bird loiters nearby, and random clutter is scattered
# throughout -- enough variety to exercise all three ground-truth generators.
name: baseline-demo
seed: 42
duration_s: 180
# A fixed, configured Unix epoch reference (2025-01-01T00:00:00Z) so
# timestamp_utc = start_utc + t_s is identical across repeated runs with the
# same seed/config -- required by constitution Principle V (reproducibility).
# Not wall-clock "now" at run start (#6).
start_utc: 1735689600
# System acceptance limits for the conformance harness (#7). They live on the
# scenario, not on a sensor, so a sensor config cannot loosen the bar it is
# tested against.
max_clock_offset_s: 0.5
min_alt_m: 0.0
max_alt_m: 200.0
defended_area:
  center_lat: 38.8895
  center_lon: -77.0353
  radius_m: 2000
drones:
  - target_id: drone-1
    start_bearing_deg: 45
    start_range_m: 3000
    speed_mps: 15
    altitude_m: 120
birds:
  - target_id: bird-1
    start_lat: 38.8920
    start_lon: -77.0300
    speed_mps: 6
    altitude_m: 40
    heading_change_period_s: 4
clutter:
  count: 10
  altitude_m: 60
  dwell_s: 1.0
