# Example sensor config (architecture.md §2). Extended in issue #6 with
# heartbeat_timeout_s, and in issue #7 with the sensor-declared conformance
# limits min_hz/max_hz/max_accuracy_m.
sensor_id: sensor-1
accuracy_m: 15.0
range_m: 5000
update_rate_hz: 2.0
dropout_probability: 0.02
heartbeat_timeout_s: 1.0
min_hz: 1.5
max_hz: 2.5
max_accuracy_m: 50.0
